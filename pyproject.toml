[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "regimebench"
version = "1.0.0"
description = "A controlled benchmark for regime-count selection on financial time series."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.2.0",
    "joblib>=1.3.0",
    "hmmlearn>=0.3.0",
    "pandas-datareader>=0.10.0",
    "fredapi>=0.5.0",
    "pyyaml>=6.0",
    "matplotlib>=3.7.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["regimebench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
